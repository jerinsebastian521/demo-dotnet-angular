<div class="auth-shell">
  <div class="card auth-card w-full border border-base-300 bg-base-100/90 shadow-2xl shadow-primary/10 backdrop-blur-sm">
    <div class="card-body p-6 sm:p-8 lg:p-10">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-8 w-8">
            <path d="M7.5 7.5a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0Zm-3 9.75a5.25 5.25 0 0 1 10.5 0v.75H4.5v-.75Zm13-1.5a4.5 4.5 0 0 1 4.5 4.5v.75h-3.75v-.75a.75.75 0 0 0-.75-.75h-2.55a5.897 5.897 0 0 0 2.55-3.75Z"/>
          </svg>
        </div>
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-primary/80">Welcome</p>
        <h2 class="mt-2 text-3xl font-bold text-base-content">Create your account</h2>
      </div>

      <form #registerForm="ngForm" (ngSubmit)="register()" class="flex w-full flex-col gap-4" action="">
        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm font-medium text-base-content/70">Display name</span>
          <input [(ngModel)]="creds.displayName" name="displayName" class="input input-bordered input-lg w-full focus:border-primary focus:outline-primary/50" type="text" placeholder="John Doe" />
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm font-medium text-base-content/70">Email</span>
          <input [(ngModel)]="creds.email" name="email" class="input input-bordered input-lg w-full focus:border-primary focus:outline-primary/50" type="email" placeholder="you@example.com" />
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm font-medium text-base-content/70">Password</span>
          <input [(ngModel)]="creds.password" name="password" class="input input-bordered input-lg w-full focus:border-primary focus:outline-primary/50" type="password" placeholder="Create a password" />
        </label>

        <button class="btn btn-primary btn-lg mt-2 w-full" type="submit">Register</button>
        <button type="button" (click)="cancel()" class="btn btn-ghost btn-lg w-full text-base-content/70">Cancel</button>
      </form>
    </div>
  </div>
</div>
