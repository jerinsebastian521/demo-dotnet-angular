<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">
     Sign Up
    </div>
    <div class="card-body w-full">
        <form #registerForm="ngForm" (ngSubmit)="register()" class="flex flex-col gap-4 w-full" action="">
            <input [(ngModel)]="creds.displayName" name="displayName" class="input input-bordered w-full"
                type="text" placeholder="Display Name" />
            <input [(ngModel)]="creds.email" name="email" class="input input-bordered w-full" type="text"
                placeholder="Email" />
            <input [(ngModel)]="creds.password" name="password" class="input input-bordered w-full"
                type="password" placeholder="Password" />
            <div class="flex items-center justify-end gap-3">
                <button class="btn btn-primary btn-lg" type="submit">Register</button>
                <button (click)="cancel()" class="btn btn-secondary btn-lg">Cancel</button>
            </div>

        </form>
    </div>
</div>
