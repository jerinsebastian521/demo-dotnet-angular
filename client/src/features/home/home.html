<div class="hero min-h-screen bg-gradient-to-br from-base-200 via-base-100 to-primary/10">
  @if (!registerMode()) {
    <div class="hero-content text-center">
      <div class="max-w-2xl">
        <div class="mb-6 inline-flex items-center gap-2 rounded-full border border-primary/20 bg-primary/5 px-4 py-2 text-sm font-medium uppercase tracking-[0.2em] text-primary">
          Meet someone new
        </div>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="mx-auto mb-6 size-20 text-primary drop-shadow-lg">
          <path fill-rule="evenodd"
            d="M8.25 6.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM15.75 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM2.25 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM6.31 15.117A6.745 6.745 0 0 1 12 12a6.745 6.745 0 0 1 6.709 7.498.75.75 0 0 1-.372.568A12.696 12.696 0 0 1 12 21.75c-2.305 0-4.47-.612-6.337-1.684a.75.75 0 0 1-.372-.568 6.787 6.787 0 0 1 1.019-4.38Z"
            clip-rule="evenodd" />
          <path
            d="M5.082 14.254a8.287 8.287 0 0 0-1.308 5.135 9.687 9.687 0 0 1-1.764-.44l-.115-.04a.563.563 0 0 1-.373-.487l-.01-.121a3.75 3.75 0 0 1 3.57-4.047ZM20.226 19.389a8.287 8.287 0 0 0-1.308-5.135 3.75 3.75 0 0 1 3.57 4.047l-.01.121a.563.563 0 0 1-.373.486l-.115.04c-.567.2-1.156.349-1.764.441Z" />
        </svg>

        <h1 class="text-5xl font-black tracking-tight text-base-content">Find your perfect match</h1>
        <p class="mx-auto mt-6 max-w-xl text-lg text-base-content/70">
          Discover new connections and build meaningful relationships with an app designed to help you meet people who truly fit your vibe.
        </p>

        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
          <button class="btn btn-primary btn-lg px-8 shadow-lg shadow-primary/20" (click)="showRegisterMode()">
            Register
          </button>
          <button class="btn btn-outline btn-lg px-8">Learn More</button>
        </div>
      </div>
    </div>
  } @else {
    <div class="flex w-full justify-center px-4 py-10">
      <app-register class="w-full max-w-xl" 
      (cancelRegister)="showRegisterMode($event)"/>
    </div>
  }
</div>
